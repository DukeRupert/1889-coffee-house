services:
  website:
    image: ${DOCKER_IMAGE:-dukerupert/1889-coffee-house:latest}
    container_name: 1889-coffee-house
    restart: unless-stopped
    ports:
      - "${LISTEN_PORT:-3000}:${PORT:-80}"
    environment:
      PORT: "${PORT:-80}"
      API_PORT: "${API_PORT:-8080}"
      ALLOWED_ORIGIN: "${ALLOWED_ORIGIN:-https://www.1889coffeehouse.com}"
      TURNSTILE_SECRET: "${TURNSTILE_SECRET:-}"
      POSTMARK_TOKEN: "${POSTMARK_TOKEN:-}"
      FROM_EMAIL: "${FROM_EMAIL:-}"
      TO_EMAIL: "${TO_EMAIL:-}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-80}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
