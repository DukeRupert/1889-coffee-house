<header class="site-header" role="banner">
  <div class="container header-inner">
    <a href="/" class="logo" aria-label="{{ .Site.Title }} — home">
      <img src="/images/logo.png" alt="1889 Coffee House" class="logo-img">
    </a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="primary-nav" aria-label="Open menu">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>
    <nav id="primary-nav" class="primary-nav" aria-label="Primary navigation">
      <ul role="menubar">
        <li role="none"><a role="menuitem" href="/about/">About</a></li>
        <li role="none"><a role="menuitem" href="/menu/">Menu</a></li>
        <li role="none"><a role="menuitem" href="#coffee">Coffee</a></li>
        <li role="none"><a role="menuitem" href="#gather">Gather</a></li>
        <li role="none"><a role="menuitem" href="#visit">Visit</a></li>
      </ul>
    </nav>
  </div>
</header>

<script>
(function() {
  const toggle = document.querySelector('.nav-toggle');
  const nav = document.getElementById('primary-nav');
  if (!toggle || !nav) return;
  toggle.addEventListener('click', function() {
    const expanded = this.getAttribute('aria-expanded') === 'true';
    this.setAttribute('aria-expanded', !expanded);
    nav.classList.toggle('is-open');
  });
})();
</script>
