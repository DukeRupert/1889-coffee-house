<header class="site-header" role="banner">
  <div class="container header-inner">
    <a href="/warm/" class="logo" aria-label="{{ .Site.Title }} — home">
      <img src="/images/logo.png" alt="1889 Coffee House" class="logo-img" width="393" height="400">
    </a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="primary-nav" aria-label="Open menu">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>
    <nav id="primary-nav" class="primary-nav" aria-label="Primary navigation">
      <ul>
        <li><a href="/warm/about/">About</a></li>
        <li><a href="/warm/menu/">Menu</a></li>
        <li><a href="/warm/coffee/">Coffee</a></li>
        <li><a href="/warm/#gather">Gather</a></li>
        <li><a href="/warm/#visit">Visit</a></li>
      </ul>
    </nav>
  </div>
</header>

<script>
(function() {
  var toggle = document.querySelector('.nav-toggle');
  var nav = document.getElementById('primary-nav');
  if (!toggle || !nav) return;

  function closeNav() {
    toggle.setAttribute('aria-expanded', 'false');
    nav.classList.remove('is-open');
  }

  function openNav() {
    toggle.setAttribute('aria-expanded', 'true');
    nav.classList.add('is-open');
  }

  toggle.addEventListener('click', function() {
    var expanded = this.getAttribute('aria-expanded') === 'true';
    expanded ? closeNav() : openNav();
  });

  nav.querySelectorAll('a').forEach(function(link) {
    link.addEventListener('click', closeNav);
  });

  document.addEventListener('click', function(e) {
    if (nav.classList.contains('is-open') && !nav.contains(e.target) && !toggle.contains(e.target)) {
      closeNav();
    }
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && nav.classList.contains('is-open')) {
      closeNav();
      toggle.focus();
    }
  });
})();
</script>
