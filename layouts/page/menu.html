{{ define "main" }}

<section class="section menu-page">
  <div class="container section-narrow">
    <span class="eyebrow">taste.</span>
    <h1 class="section-headline">Our Menu</h1>
    <p class="menu-intro">Sandwiches made to order. Eggs cracked in-house. Coffee roasted by Ghost Town in Bozeman. No freezer, no shortcuts.</p>

    <div class="menu-tabs">
      <button class="menu-tab is-active" data-tab="food" aria-pressed="true">Food</button>
      <button class="menu-tab" data-tab="drinks" aria-pressed="false">Drinks</button>
    </div>

    <div class="menu-panel is-active" id="panel-food">
      <img src="/images/menu-1.jpg" alt="1889 Coffee House food menu — sandwiches, salads, soups, breakfast, and kids meals" class="menu-img">
    </div>

    <div class="menu-panel" id="panel-drinks">
      <img src="/images/menu-2.jpg" alt="1889 Coffee House drink menu — espresso, cold drinks, coffee, beverages, and sweet treats" class="menu-img">
    </div>
  </div>
</section>

{{ end }}

{{ define "scripts" }}
<script>
(function() {
  var tabs = document.querySelectorAll('.menu-tab');
  tabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      tabs.forEach(function(t) {
        t.classList.remove('is-active');
        t.setAttribute('aria-pressed', 'false');
      });
      document.querySelectorAll('.menu-panel').forEach(function(p) {
        p.classList.remove('is-active');
      });
      tab.classList.add('is-active');
      tab.setAttribute('aria-pressed', 'true');
      document.getElementById('panel-' + tab.dataset.tab).classList.add('is-active');
    });
  });
})();
</script>
{{ end }}
